<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Oracle</title>
    <meta name="description" content="Answer 3 absurd questions. Get a film recommendation that somehow feels right.">
    <meta name="theme-color" content="#0a0a0f">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <meta property="og:title" content="Movie Oracle">
    <meta property="og:description" content="Answer 3 absurd questions. Get a film recommendation that somehow feels right.">
    <!-- Relative so the card resolves against whatever domain serves the page. -->
    <meta property="og:image" content="og-cover.jpg">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Posters come straight from TMDB; warm the connection before the reel asks. -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin>

    <link rel="stylesheet" href="styles.css">
    <script src="vendor/gsap.min.js" defer></script>
</head>
<body>

<!-- Screen-reader announcements for screen changes. -->
<div class="sr-only" id="liveRegion" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- REEL HOMEPAGE (3D helix) -->
<div class="reel-screen active" id="reel">
    <div class="reel-canvas-host" id="reelCanvasHost"></div>
    <div class="reel-loading" id="reelLoading">Loading the reel…</div>
    <div class="reel-header">
        <div class="reel-brand">Movie Oracle</div>
        <div class="reel-brand-sub">Trending this week</div>
    </div>
    <div class="reel-hint">Swipe · scroll · tap</div>
    <div class="reel-meta" id="reelMeta">
        <div class="reel-meta-title" id="reelMetaTitle"></div>
        <div class="reel-meta-sub" id="reelMetaSub"></div>
    </div>
    <div class="reel-cta-bar">
        <button class="reel-cta" id="reelCta" type="button">
            Pick for me <span class="arrow" aria-hidden="true">→</span>
        </button>
    </div>
    <div class="reel-fallback" id="reelFallback">
        <div class="reel-fallback-grid" id="reelFallbackGrid"></div>
    </div>
</div>

<div class="app">

    <!-- DECO IMAGES -->
    <div class="deco deco-wtf"><img src="deco-wtf.webp" alt="" width="560" height="560"></div>
    <div class="deco deco-alien"><img src="deco-alien.webp" alt="" width="520" height="520"></div>
    <div class="deco deco-cursor"><img src="deco-cursor.webp" alt="" width="400" height="400"></div>
    <div class="deco deco-tv"><img src="deco-tv.webp" alt="" width="600" height="600"></div>

    <!-- LANDING (shown only when TMDB is unreachable and the reel can't load) -->
    <div class="screen" id="landing">
        <div class="oracle-symbol"><img src="oracle-star.webp" alt="" width="800" height="800"></div>
        <h1 class="landing-title">Movie<br>Oracle</h1>
        <p class="landing-subtitle">Answer 3 questions. Get your perfect movie.</p>
        <button class="btn-primary" id="startBtn" type="button">Consult the Oracle</button>
    </div>

    <!-- QUESTION -->
    <div class="screen" id="question">
        <div class="question-progress" id="questionProgress">1 / 3</div>
        <h2 class="question-text" id="questionText"></h2>
        <div class="answer-group" id="answerGroup">
            <button class="answer-btn" id="answerA" type="button"></button>
            <button class="answer-btn" id="answerB" type="button"></button>
        </div>
    </div>

    <!-- LOADING -->
    <div class="screen" id="loading">
        <div class="loading-text" id="loadingText">Consulting the Oracle...</div>
        <div class="loading-dots" aria-hidden="true">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- RESULT -->
    <div class="screen" id="result">
        <div class="result-top">
            <button class="result-poster" id="resultPoster" type="button"
                    aria-expanded="false" aria-controls="resultDetails"
                    aria-label="Show details">
                <img id="posterImg" alt="">
            </button>
            <div class="result-details" id="resultDetails">
                <div class="details-inner">
                    <p class="details-overview" id="detailsOverview"></p>
                    <p class="details-why" id="detailsWhy"></p>
                </div>
            </div>
        </div>
        <h2 class="result-title" id="resultTitle"></h2>
        <div class="result-meta" id="resultMeta"></div>
        <p class="result-hook" id="resultHook"></p>
        <div class="result-actions">
            <button class="btn-primary btn-trailer" id="trailerBtn" type="button" data-state="none">
                <svg class="trailer-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"/></svg> Watch Trailer
            </button>
            <button class="btn-secondary" id="anotherBtn" type="button" hidden>Not this one</button>
            <button class="btn-secondary" id="homeBtn" type="button">Back to Home</button>
        </div>
    </div>

    <!-- ERROR -->
    <div class="screen" id="error">
        <p class="error-text" id="errorText">Something went wrong. The Oracle is resting.</p>
        <button class="btn-secondary" id="errorHomeBtn" type="button">Back to Home</button>
    </div>

    <!-- TRAILER MODAL -->
    <div class="trailer-modal" id="trailerModal" role="dialog" aria-modal="true" aria-label="Trailer" hidden>
        <button class="trailer-close" id="trailerClose" type="button" aria-label="Close trailer">×</button>
        <div class="trailer-frame-wrap">
            <iframe class="trailer-frame" id="trailerFrame" title="Movie trailer" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
